<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <!-- Placeholder shown until assets/demo.mp4 is added. Illustrative numbers only. -->
  <rect width="540" height="960" fill="#0b1220"/>
